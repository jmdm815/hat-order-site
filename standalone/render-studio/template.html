<title>JM Render Studio</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access", "notifications"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#141a2e; --muted:#5d6580; --line:#e2e5ee; --soft:#eef0f5;
  --accent:#ed1c24; --accent-ink:#ffffff; --navy:#141a2e; --ok:#1d8a4e; --warn:#a86a00; --bad:#c4271e;
  --radius:10px; --shadow:0 1px 2px rgba(20,26,46,.06),0 4px 14px rgba(20,26,46,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --panel:#161b2c; --ink:#eef0f6; --muted:#9aa2bb; --line:#262d44; --soft:#1d2338;
  --accent:#ff3b42; --navy:#0b0f1c; --ok:#48c07a; --warn:#e0a640; --bad:#ff6b63; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0e1220; --panel:#161b2c; --ink:#eef0f6; --muted:#9aa2bb; --line:#262d44; --soft:#1d2338;
  --accent:#ff3b42; --navy:#0b0f1c; --ok:#48c07a; --warn:#e0a640; --bad:#ff6b63; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--navy);color:#fff;-webkit-app-region:drag}
.top button{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.01em}
.mark{font:400 20px Anton,Impact,sans-serif;background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;margin-left:12px;flex:1}
.tabbtn{background:none;border:0;color:#c9cee0;font:600 13px Inter,sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer}
.tabbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.tabbtn.on{background:rgba(255,255,255,.14);color:#fff}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.25);background:transparent}
.tab{flex:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
.tab[hidden]{display:none}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:10px}
.panel h3{font:800 11px Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.panel h3:first-of-type{border-top:0;padding-top:0}
.stage{overflow:auto;padding:20px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight>.field{flex:1;min-width:90px}
.field{display:flex;flex-direction:column;gap:4px}
.lbl{font-weight:600;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint.warn,.warn{color:var(--warn)} .hint.bad,.bad,.err{color:var(--bad)} .ok{color:var(--ok);font-weight:600}
p.warn{margin:4px 0;font-size:12.5px}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:transparent}
textarea{resize:vertical}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.btn{font:600 13px Inter,sans-serif;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px}
.btn.big{padding:14px 26px;font-size:15px}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#e6e8ee 25%,transparent 25%),linear-gradient(-45deg,#e6e8ee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e8ee 75%),linear-gradient(-45deg,transparent 75%,#e6e8ee 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.logo-box{border:1px solid var(--line);border-radius:var(--radius);min-height:110px;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.logo-box canvas{max-width:100%;max-height:180px;width:auto;height:auto;object-fit:contain}
.logo-box .empty{color:#8a91a8;font-size:12px}
.results{display:flex;flex-direction:column;gap:4px}
.result{text-align:left;display:flex;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:inherit;cursor:pointer}
.result:hover{border-color:var(--accent)}
.result span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked{margin:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font:500 12px Inter,sans-serif;cursor:pointer}
.chip i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.grid.stills{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.card canvas,.card img{display:block;width:100%;height:auto}
.card figcaption{padding:8px 12px;font-weight:600;font-size:12.5px;border-top:1px solid var(--line)}
.card.loading .ph{aspect-ratio:4/5;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{color:var(--muted);text-align:center;padding:60px 20px;grid-column:1/-1}
.art-list{display:flex;flex-direction:column;gap:8px}
.art{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.art .thumb{width:64px;height:64px;border-radius:6px;display:grid;place-items:center;overflow:hidden}
.art .thumb canvas{max-width:60px;max-height:60px}
.art-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.art-body b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-info{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;flex-direction:column}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sheet-info p{flex-basis:100%}
.sheet-wrap canvas.sheet{border:1px solid var(--line);box-shadow:var(--shadow);max-width:100%}
.card{position:relative}
canvas.shot.draggable{cursor:grab;touch-action:none}
.card.dragging canvas.shot{cursor:grabbing;opacity:.75}
.drag-logo{position:absolute;pointer-events:none;outline:1.5px dashed var(--accent);outline-offset:2px;z-index:2}
.segbar{display:inline-flex;width:fit-content;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px;gap:2px}
.segbar[hidden]{display:none}
.seg{border:0;background:none;color:var(--muted);font:600 13px Inter,sans-serif;padding:7px 14px;border-radius:7px;cursor:pointer}
.seg.on{background:var(--accent);color:#fff}
.ai-box{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ai-box[open]{gap:10px}
.ai-box>.btn{align-self:flex-start}
.ai-box summary{font-weight:700;cursor:pointer}
.ai-box>*:not(summary){margin-top:8px}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1;min-width:0}
.lbl-row{display:flex;justify-content:space-between;align-items:center}
.reset{border:0;background:none;color:var(--accent);font:600 11.5px Inter,sans-serif;cursor:pointer;padding:0}
.reset:hover{text-decoration:underline}
.arrow-pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,36px);gap:4px}
.arrow{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;font-size:17px;cursor:pointer;user-select:none;touch-action:none}
.arrow:hover{border-color:var(--accent)}
.arrow:active{background:color-mix(in srgb,var(--accent) 18%,var(--soft))}
.arrow.center{font-size:15px;color:var(--muted)}
.tag{margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.not-drawn{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12.5px;background:var(--soft);text-align:center;padding:12px}
.not-drawn b{color:var(--ink);font-size:14px}
.cap{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:8px}
.cap input:nth-child(2){color:var(--accent)}
.setup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.log{background:#0b0f1c;color:#cfd6ea;font:11px/1.4 ui-monospace,Menlo,monospace;border-radius:8px;padding:10px;max-height:200px;overflow:auto;white-space:pre-wrap;margin:0}
progress{width:100%;height:8px;accent-color:var(--accent)}
.gate{margin:auto;max-width:480px;text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate h1{font:400 40px/1.1 Anton,Impact,sans-serif;letter-spacing:.02em;margin:0}
.gate p{color:var(--muted);margin:0}
.gate-mark{font:400 44px Anton,Impact,sans-serif;background:var(--navy);color:#fff;border-radius:18px;padding:14px 22px;border-bottom:10px solid var(--accent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:.2s;max-width:min(560px,90vw);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad);color:#fff} #toast.ok{background:var(--ok);color:#fff}
@media (max-width:760px){.tab{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid var(--line)}.tabs{margin-left:0}.top{flex-wrap:wrap}}
</style>
<div id="app"><div class="gate"><div class="gate-mark">JM</div><p class="hint">Loading…</p></div></div>
<script>/*BUNDLE*/</script>
